name: Deploy proposal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - client/proposal-tiers.html
      - client/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish ONLY the client proposal; internal docs must never reach Pages.
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp client/proposal-tiers.html _site/index.html
          cp client/images/zemismart-push-switch.jpg client/images/clipsal-iconic-switch.png client/images/clipsal-rotary-plate-candidate.webp client/images/samsung-galaxy-tab-a9-plus.png _site/images/
          cp client/images/clipsal-iconic-vivid-white.jpg client/images/clipsal-iconic-extra-white.jpg client/images/clipsal-iconic-cool-grey.jpg client/images/clipsal-iconic-anthracite.jpg client/images/clipsal-iconic-black.jpg _site/images/
          mkdir -p _site/images/proposal-ranges
          cp client/images/proposal-ranges/*.jpg _site/images/proposal-ranges/
          mkdir -p _site/images/clipsal/processed
          cp -R client/images/clipsal/processed/. _site/images/clipsal/processed/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4